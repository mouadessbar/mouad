<style>
body {

    font-family: 'Poppins', sans-serif;
    background-color: #111;
    color: #fff;
    text-align: center;
    padding-bottom: 100px; /* space for fixed button */
}

.container {
    max-width: 600px;

    padding: 30px 20px;

h1 {
    color: #f1c40f;

    font-size: 18px;
    font-weight: 600;
    text-decoration: none;
    border-radius: 6px;
    margin-top: 20px;

.btn:hover {

.badge {

/* Fixed Button (mobile) */
.btn-fixed {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 400px;
    padding: 15px;
    background-color: #f1c40f;
    color: #111;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 10px;
    z-index: 1000;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
}

/* Show fixed button only on mobile */
@media (min-width: 769px) {
